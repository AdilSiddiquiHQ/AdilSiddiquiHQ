<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Adil Siddiqui — Founder, NinjaLabs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a101c"/>
      <stop offset="100%" stop-color="#061a1e"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7f9ee"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#7dd3fc" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <ellipse cx="600" cy="150" rx="560" ry="200" fill="url(#glow)"/>

  <g stroke="#22d3ee" stroke-opacity="0.30" stroke-width="2" fill="none">
    <path d="M44 44 h30 M44 44 v30"/>
    <path d="M1156 44 h-30 M1156 44 v30"/>
    <path d="M44 256 h30 M44 256 v-30"/>
    <path d="M1156 256 h-30 M1156 256 v-30"/>
  </g>

  <text x="600" y="145" text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="70" font-weight="800" letter-spacing="5" fill="url(#nameGrad)">ADIL SIDDIQUI</text>

  <rect x="546" y="170" width="108" height="2.5" rx="1.25" fill="url(#rule)"/>

  <text x="600" y="212" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" font-weight="500" letter-spacing="6.5" fill="#9fb3c8">FOUNDER · NINJALABS</text>

  <text x="600" y="248" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" font-weight="400" letter-spacing="3.2" fill="#4b6070">LOCAL-FIRST APPS · AGENT TOOLING · ON-DEVICE MEDIA</text>
</svg>
